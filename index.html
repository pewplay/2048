<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>2048</title>
  <meta name="description" content="Slide the numbered tiles, merge matching pairs and build the 2048 tile.">
  <meta name="theme-color" content="#faf8ef">
  <link href="style/main.css" rel="stylesheet">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="meta/apple-touch-icon.png">
</head>
<body>
  <main class="app" id="app" data-sides="1">
    <header class="head">
      <h1 class="title">2048</h1>
      <div class="scores">
        <div class="score-box"><span class="label">Time</span><span id="timer-value" class="value">00:00</span></div>
        <div class="score-box"><span class="label">Score</span><div class="score-container value">0</div></div>
        <div class="score-box"><span class="label">Best</span><div class="best-container value">0</div></div>
      </div>
    </header>

    <div class="bar">
      <p class="game-intro">Join the numbers and get to the <strong>2048 tile!</strong></p>
      <button type="button" class="restart-button btn">New Game</button>
    </div>

    <div class="stage">
      <div class="game-container" aria-label="Game board">
        <div class="game-message" aria-live="polite">
          <p></p>
          <div class="lower">
            <button type="button" class="keep-playing-button btn">Keep going</button>
            <button type="button" class="retry-button btn">Try again</button>
          </div>
        </div>

        <div class="grid-container">
          <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
          <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
          <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
          <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        </div>

        <div class="tile-container"></div>
      </div>
    </div>

    <p class="help optional">
      <strong>How to play:</strong>
      <span class="touch-only"><strong>Swipe</strong> anywhere to move the tiles.</span>
      <span class="no-touch-only">Use the <strong>arrow keys</strong> or <strong>WASD</strong> (or drag with the mouse) to move the tiles.</span>
      When two tiles with the same number touch, they <strong>merge into one!</strong>
      The timer starts with your first move.
    </p>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/time.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
